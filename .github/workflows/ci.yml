name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest

      # rtcheck's own dogfood: the example is seeded with three violations, so
      # a clean run here means the checker has stopped seeing them.
      - name: the example must still report its seeded violations
        run: |
          set +e
          rtcheck examples/audio --entry mix_frame
          test $? -eq 1
